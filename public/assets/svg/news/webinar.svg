<?xml version="1.0" encoding="UTF-8"?>
<svg width="800px" height="600px" viewBox="0 0 800 600" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Background -->
        <rect fill="#F3F4F6" x="0" y="0" width="800" height="600"/>
        
        <!-- Computer Screen -->
        <rect x="200" y="100" width="400" height="300" rx="20" fill="#1E40AF"/>
        <rect x="220" y="120" width="360" height="260" rx="10" fill="#2563EB"/>
        
        <!-- Screen Content -->
        <circle cx="400" cy="250" r="80" fill="#3B82F6"/>
        <path d="M380,230 L420,250 L380,270 Z" fill="#FFFFFF"/>
        
        <!-- Computer Base -->
        <path d="M300,400 L500,400 L450,450 L350,450 Z" fill="#1E40AF"/>
        
        <!-- Decorative Elements -->
        <circle cx="200" cy="200" r="20" fill="#FCD34D" opacity="0.5"/>
        <circle cx="600" cy="200" r="20" fill="#FCD34D" opacity="0.5"/>
        <circle cx="400" cy="100" r="20" fill="#FCD34D" opacity="0.5"/>
        
        <!-- Sound Waves -->
        <path d="M150,300 Q200,250 250,300" stroke="#3B82F6" stroke-width="2" fill="none"/>
        <path d="M550,300 Q500,250 450,300" stroke="#3B82F6" stroke-width="2" fill="none"/>
    </g>
</svg> 