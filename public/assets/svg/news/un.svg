<?xml version="1.0" encoding="UTF-8"?>
<svg width="800px" height="600px" viewBox="0 0 800 600" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Background -->
        <rect fill="#F3F4F6" x="0" y="0" width="800" height="600"/>
        
        <!-- Exam Paper -->
        <rect x="200" y="100" width="400" height="400" fill="#FFFFFF"/>
        <rect x="200" y="100" width="400" height="400" stroke="#1E40AF" stroke-width="4"/>
        
        <!-- Header -->
        <rect x="250" y="150" width="300" height="40" fill="#1E40AF"/>
        <text x="400" y="175" font-family="Arial" font-size="24" fill="#FFFFFF" text-anchor="middle">UJIAN NASIONAL</text>
        
        <!-- Question Numbers -->
        <circle cx="250" cy="250" r="15" fill="#2563EB"/>
        <text x="250" y="255" font-family="Arial" font-size="16" fill="#FFFFFF" text-anchor="middle">1</text>
        
        <circle cx="250" cy="300" r="15" fill="#2563EB"/>
        <text x="250" y="305" font-family="Arial" font-size="16" fill="#FFFFFF" text-anchor="middle">2</text>
        
        <circle cx="250" cy="350" r="15" fill="#2563EB"/>
        <text x="250" y="355" font-family="Arial" font-size="16" fill="#FFFFFF" text-anchor="middle">3</text>
        
        <!-- Decorative Elements -->
        <path d="M150,100 L650,100" stroke="#FCD34D" stroke-width="4"/>
        <path d="M150,500 L650,500" stroke="#FCD34D" stroke-width="4"/>
        <circle cx="400" cy="100" r="20" fill="#FCD34D"/>
        <circle cx="400" cy="500" r="20" fill="#FCD34D"/>
    </g>
</svg> 