<?xml version="1.0" encoding="UTF-8"?>
<svg width="800px" height="600px" viewBox="0 0 800 600" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Background -->
        <rect fill="#F3F4F6" x="0" y="0" width="800" height="600"/>
        
        <!-- Math Symbols -->
        <text x="200" y="300" font-family="Arial" font-size="120" fill="#1E40AF">+</text>
        <text x="350" y="300" font-family="Arial" font-size="120" fill="#2563EB">-</text>
        <text x="500" y="300" font-family="Arial" font-size="120" fill="#3B82F6">×</text>
        <text x="650" y="300" font-family="Arial" font-size="120" fill="#1E40AF">÷</text>
        
        <!-- Numbers -->
        <text x="150" y="200" font-family="Arial" font-size="80" fill="#4B5563">2</text>
        <text x="300" y="200" font-family="Arial" font-size="80" fill="#4B5563">5</text>
        <text x="450" y="200" font-family="Arial" font-size="80" fill="#4B5563">8</text>
        <text x="600" y="200" font-family="Arial" font-size="80" fill="#4B5563">4</text>
        
        <!-- Decorative Elements -->
        <circle cx="400" cy="450" r="100" fill="#FCD34D" opacity="0.2"/>
        <circle cx="400" cy="450" r="80" fill="#FCD34D" opacity="0.3"/>
        <circle cx="400" cy="450" r="60" fill="#FCD34D" opacity="0.4"/>
    </g>
</svg> 