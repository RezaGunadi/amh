<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Video Conference Frame -->
    <rect x="50" y="30" width="200" height="120" rx="10" fill="#F3F4F6"/>
    <rect x="60" y="40" width="180" height="100" rx="5" fill="#4F46E5" opacity="0.1"/>
    
    <!-- Video Conference Elements -->
    <circle cx="150" cy="90" r="30" fill="#818CF8" opacity="0.2"/>
    <path d="M140 90 L160 90" stroke="#4F46E5" stroke-width="2"/>
    <path d="M150 80 L150 100" stroke="#4F46E5" stroke-width="2"/>
    
    <!-- Document Elements -->
    <rect x="220" y="60" width="40" height="50" rx="5" fill="#C7D2FE"/>
    <path d="M230 70 L250 70" stroke="#4F46E5" stroke-width="2"/>
    <path d="M230 80 L250 80" stroke="#4F46E5" stroke-width="2"/>
    <path d="M230 90 L250 90" stroke="#4F46E5" stroke-width="2"/>
    
    <!-- Connection Lines -->
    <path d="M200 90 L220 85" stroke="#4F46E5" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M200 90 L220 95" stroke="#4F46E5" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Decorative Elements -->
    <circle cx="40" cy="40" r="5" fill="#4F46E5" opacity="0.3"/>
    <circle cx="260" cy="40" r="5" fill="#818CF8" opacity="0.3"/>
    <circle cx="40" cy="160" r="5" fill="#818CF8" opacity="0.3"/>
    <circle cx="260" cy="160" r="5" fill="#4F46E5" opacity="0.3"/>
    
    <!-- Shine Effects -->
    <path d="M70 50 L75 55" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
    <path d="M230 70 L235 75" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
    <path d="M150 90 L155 95" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
</svg> 