<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891B2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="55" fill="url(#grad3)" opacity="0.1"/>
  
  <!-- Laptop -->
  <rect x="25" y="45" width="70" height="40" rx="3" fill="#06B6D4"/>
  <rect x="30" y="50" width="60" height="30" rx="1" fill="#1F2937"/>
  
  <!-- Screen Content -->
  <rect x="35" y="55" width="50" height="20" fill="#0891B2" opacity="0.3"/>
  <circle cx="45" cy="65" r="2" fill="#06B6D4"/>
  <rect x="50" y="63" width="30" height="2" fill="#06B6D4"/>
  <rect x="50" y="67" width="25" height="2" fill="#06B6D4"/>
  <rect x="50" y="71" width="20" height="2" fill="#06B6D4"/>
  
  <!-- Laptop Base -->
  <rect x="30" y="85" width="60" height="5" rx="2" fill="#0891B2"/>
  <rect x="35" y="90" width="50" height="2" rx="1" fill="#06B6D4"/>
  
  <!-- Circuit Board Pattern -->
  <rect x="40" y="60" width="2" height="2" fill="#F59E0B"/>
  <rect x="45" y="60" width="2" height="2" fill="#F59E0B"/>
  <rect x="50" y="60" width="2" height="2" fill="#F59E0B"/>
  <rect x="55" y="60" width="2" height="2" fill="#F59E0B"/>
  
  <!-- Code Symbols -->
  <text x="35" y="75" font-family="monospace" font-size="8" fill="#F59E0B">&lt;/&gt;</text>
  <text x="70" y="75" font-family="monospace" font-size="8" fill="#F59E0B">{}</text>
  
  <!-- Floating Elements -->
  <circle cx="20" cy="30" r="3" fill="#06B6D4" opacity="0.6"/>
  <circle cx="100" cy="40" r="2" fill="#0891B2" opacity="0.6"/>
  <circle cx="15" cy="80" r="2" fill="#06B6D4" opacity="0.6"/>
  <circle cx="105" cy="70" r="3" fill="#0891B2" opacity="0.6"/>
</svg> 