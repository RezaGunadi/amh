<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Background Circle -->
    <circle cx="100" cy="100" r="100" fill="#f3f4f6"/>
    
    <!-- Professional Suit -->
    <path d="M70 80 L130 80 L130 160 L70 160 Z" fill="#4F46E5"/>
    <path d="M70 80 L130 80 L120 100 L80 100 Z" fill="#818CF8"/>
    
    <!-- Collar -->
    <path d="M90 100 L110 100 L100 120 Z" fill="white"/>
    
    <!-- Head -->
    <circle cx="100" cy="60" r="25" fill="#f3d5b5"/>
    
    <!-- Hair -->
    <path d="M75 60 Q100 30 125 60" fill="#4a4a4a"/>
    
    <!-- Face Features -->
    <circle cx="90" cy="55" r="3" fill="#4a4a4a"/> <!-- Left Eye -->
    <circle cx="110" cy="55" r="3" fill="#4a4a4a"/> <!-- Right Eye -->
    <path d="M95 70 Q100 75 105 70" stroke="#4a4a4a" fill="none" stroke-width="2"/> <!-- Smile -->
    
    <!-- Glasses -->
    <rect x="85" y="50" width="10" height="10" rx="2" fill="none" stroke="#4a4a4a" stroke-width="2"/>
    <rect x="105" y="50" width="10" height="10" rx="2" fill="none" stroke="#4a4a4a" stroke-width="2"/>
    <path d="M95 55 L105 55" stroke="#4a4a4a" stroke-width="2"/>
    
    <!-- Decorative Elements -->
    <circle cx="100" cy="100" r="90" fill="none" stroke="#4F46E5" stroke-width="2" stroke-opacity="0.1"/>
    <circle cx="100" cy="100" r="80" fill="none" stroke="#818CF8" stroke-width="2" stroke-opacity="0.1"/>
    
    <!-- Shine Effects -->
    <path d="M85 45 L90 40" stroke="white" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M115 45 L120 40" stroke="white" stroke-width="2" stroke-opacity="0.5"/>
</svg> 