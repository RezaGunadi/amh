<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Background Circle -->
    <circle cx="100" cy="100" r="100" fill="#f3f4f6"/>
    
    <!-- Student Head -->
    <circle cx="100" cy="70" r="25" fill="#f3d5b5"/>
    
    <!-- Hair -->
    <path d="M75 70 Q100 40 125 70" fill="#4a4a4a"/>
    
    <!-- Face Features -->
    <circle cx="90" cy="65" r="3" fill="#4a4a4a"/> <!-- Left Eye -->
    <circle cx="110" cy="65" r="3" fill="#4a4a4a"/> <!-- Right Eye -->
    <path d="M95 80 Q100 85 105 80" stroke="#4a4a4a" fill="none" stroke-width="2"/> <!-- Smile -->
    
    <!-- Graduation Cap -->
    <path d="M70 50 L100 30 L130 50" fill="#4F46E5"/>
    <path d="M100 30 L100 60" stroke="#4F46E5" stroke-width="2"/>
    <path d="M100 60 L80 70 L120 70 Z" fill="#818CF8"/>
    
    <!-- Tassel -->
    <path d="M100 70 L100 90" stroke="#4F46E5" stroke-width="2"/>
    <circle cx="100" cy="90" r="5" fill="#4F46E5"/>
    <path d="M100 90 L90 100" stroke="#4F46E5" stroke-width="2"/>
    <path d="M100 90 L110 100" stroke="#4F46E5" stroke-width="2"/>
    
    <!-- Rising Graph -->
    <path d="M50 140 L70 130 L90 120 L110 110 L130 100 L150 90" 
          stroke="#4F46E5" 
          stroke-width="3" 
          fill="none"/>
    
    <!-- Graph Points -->
    <circle cx="70" cy="130" r="4" fill="#4F46E5"/>
    <circle cx="90" cy="120" r="4" fill="#4F46E5"/>
    <circle cx="110" cy="110" r="4" fill="#4F46E5"/>
    <circle cx="130" cy="100" r="4" fill="#4F46E5"/>
    <circle cx="150" cy="90" r="4" fill="#4F46E5"/>
    
    <!-- Decorative Elements -->
    <circle cx="100" cy="100" r="90" fill="none" stroke="#4F46E5" stroke-width="2" stroke-opacity="0.1"/>
    <circle cx="100" cy="100" r="80" fill="none" stroke="#818CF8" stroke-width="2" stroke-opacity="0.1"/>
    
    <!-- Shine Effects -->
    <path d="M85 55 L90 50" stroke="white" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M115 55 L120 50" stroke="white" stroke-width="2" stroke-opacity="0.5"/>
</svg> 