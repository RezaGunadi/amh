<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Subtle classroom background with more depth -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,0.98);stop-opacity:1" />
            <stop offset="50%" style="stop-color:rgba(248,249,250,0.95);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgba(240,242,245,0.92);stop-opacity:1" />
        </linearGradient>

        <!-- Enhanced black gradient for cap -->
        <linearGradient id="capGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#1a1a1a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
        </linearGradient>

        <!-- Traditional Quran cover gradient -->
        <linearGradient id="quranGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0d4b26;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#1a6b3c;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0d4b26;stop-opacity:1" />
        </linearGradient>

        <!-- Gold accent gradient -->
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#ffd700;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
        </linearGradient>

        <!-- Enhanced glow effect -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Islamic pattern -->
        <pattern id="islamicPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M0,0 L20,20 M20,0 L0,20" stroke="#495057" stroke-width="0.5" opacity="0.1"/>
        </pattern>
    </defs>

    <!-- Background with enhanced classroom elements -->
    <rect width="800" height="400" fill="url(#bgGradient)"/>
    <rect width="800" height="400" fill="url(#islamicPattern)"/>
    
    <!-- Classroom decorative elements -->
    <g opacity="0.15">
        <!-- Board lines -->
        <path d="M100,50 L700,50" stroke="#495057" stroke-width="1" stroke-dasharray="5,5"/>
        <path d="M100,70 L700,70" stroke="#495057" stroke-width="1" stroke-dasharray="5,5"/>
        <!-- Islamic geometric patterns -->
        <path d="M0,0 L800,400" stroke="#495057" stroke-width="0.5" fill="none"/>
        <path d="M800,0 L0,400" stroke="#495057" stroke-width="0.5" fill="none"/>
        <circle cx="400" cy="200" r="150" fill="none" stroke="#495057" stroke-width="0.5"/>
        <!-- Additional decorative elements -->
        <path d="M200,100 Q400,50 600,100" stroke="#495057" stroke-width="0.5" fill="none"/>
        <path d="M200,300 Q400,350 600,300" stroke="#495057" stroke-width="0.5" fill="none"/>
    </g>

    <!-- Main content container -->
    <g transform="translate(400,200)">

        <!-- Enhanced Islamic University Graduation Cap -->
        <g transform="translate(-200,0) scale(0.8)">
            <!-- Cap base - more refined square shape -->
            <path d="M0,0 L120,0 L120,-20 L0,-20 Z" fill="url(#capGradient)"/>
            <!-- Cap top - traditional square shape with slight curve -->
            <path d="M20,-20 L100,-20 L100,-60 L20,-60 Z" fill="url(#capGradient)"/>
            <!-- Cap shine effects -->
            <path d="M30,-30 L90,-30" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
            <path d="M30,-40 L90,-40" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
            <!-- Enhanced Tassel -->
            <g transform="translate(60,-60)">
                <!-- Tassel string -->
                <path d="M0,0 L0,25" stroke="#1a1a1a" stroke-width="2"/>
                <!-- Tassel head -->
                <circle cx="0" cy="25" r="6" fill="#1a1a1a"/>
                <!-- Tassel strands with more detail -->
                <g stroke="#1a1a1a" stroke-width="1">
                    <path d="M0,25 Q5,20 10,30"/>
                    <path d="M0,25 Q-5,20 -10,30"/>
                    <path d="M0,25 Q8,15 15,30"/>
                    <path d="M0,25 Q-8,15 -15,30"/>
                    <path d="M0,25 Q10,10 20,30"/>
                    <path d="M0,25 Q-10,10 -20,30"/>
                </g>
            </g>
        </g>

        <!-- Enhanced Traditional Quran Style Book -->
        <g transform="translate(100,0) scale(0.8)">
            <!-- Book shadow with better depth -->
            <rect x="15" y="15" width="120" height="80" rx="5" fill="#000" opacity="0.15"/>
            <!-- Left page with traditional paper color -->
            <rect x="0" y="-60" width="60" height="80" rx="5" fill="#fff9e6"/>
            <!-- Right page with traditional paper color -->
            <rect x="60" y="-60" width="60" height="80" rx="5" fill="#fff9e6"/>
            <!-- Quran cover with enhanced gradient -->
            <rect x="0" y="-60" width="120" height="80" rx="5" fill="url(#quranGradient)"/>
            <!-- Enhanced Quran decoration -->
            <path d="M30,-40 C40,-45 80,-45 90,-40" stroke="url(#goldGradient)" stroke-width="1" opacity="0.7"/>
            <path d="M30,-30 C40,-35 80,-35 90,-30" stroke="url(#goldGradient)" stroke-width="1" opacity="0.5"/>
            <!-- Enhanced Arabic text decoration -->
            <text x="60" y="-20" 
                  font-family="'Traditional Arabic', serif" 
                  font-size="32" 
                  fill="url(#goldGradient)" 
                  text-anchor="middle"
                  opacity="0.8">
                بسم الله الرحمن الرحيم
            </text>
            <!-- Enhanced page lines -->
            <g stroke="#d4b483" stroke-width="0.5">
                <path d="M10,-55 L50,-55"/>
                <path d="M10,-45 L50,-45"/>
                <path d="M10,-35 L50,-35"/>
                <path d="M10,-25 L50,-25"/>
                <path d="M70,-55 L110,-55"/>
                <path d="M70,-45 L110,-45"/>
                <path d="M70,-35 L110,-35"/>
                <path d="M70,-25 L110,-25"/>
            </g>
            <!-- Enhanced Quran corner decorations -->
            <path d="M10,-55 L20,-55 L20,-45 L10,-45 Z" fill="none" stroke="url(#goldGradient)" stroke-width="0.5"/>
            <path d="M90,-55 L100,-55 L100,-45 L90,-45 Z" fill="none" stroke="url(#goldGradient)" stroke-width="0.5"/>
            <!-- Additional decorative elements -->
            <circle cx="60" cy="-50" r="15" fill="none" stroke="url(#goldGradient)" stroke-width="0.5" opacity="0.3"/>
        </g>

        <!-- Enhanced Main Text "Kelas Privat" -->
        <text x="0" y="-120" 
              font-family="'Segoe UI', Arial, sans-serif" 
              font-size="48" 
              font-weight="bold" 
              fill="#1a1a1a" 
              text-anchor="middle"
              filter="url(#glow)">
            Kelas Privat
        </text>

        <!-- Enhanced Subtitle -->
        <text x="0" y="-80" 
              font-family="'Segoe UI', Arial, sans-serif" 
              font-size="24" 
              fill="#495057" 
              text-anchor="middle"
              opacity="0.8">
            Excellence in Education
        </text>
    </g>

    <!-- Enhanced decorative elements -->
    <g opacity="0.1">
        <!-- Islamic geometric patterns -->
        <circle cx="100" cy="100" r="30" fill="none" stroke="#495057" stroke-width="0.5"/>
        <circle cx="700" cy="300" r="40" fill="none" stroke="#495057" stroke-width="0.5"/>
        <circle cx="400" cy="350" r="35" fill="none" stroke="#495057" stroke-width="0.5"/>
        <!-- Additional decorative elements -->
        <path d="M200,150 Q400,100 600,150" stroke="#495057" stroke-width="0.5" fill="none"/>
        <path d="M200,250 Q400,300 600,250" stroke="#495057" stroke-width="0.5" fill="none"/>
    </g>
</svg> 